<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Johnny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: late-night hypnotic techno, quiet and confident.
   IDEA: a 90s handset lying on a club table; its green LCD is the whole show.
   PICTURE: the FM-1's own screen, drawn by the firmware engine, inside the phone body.
   COLOUR: charcoal handset, pale LCD green, olive ink; the page stays in the dark room.
   TYPE: Silkscreen for labels, VT323 for small print. LAYOUT: phone centred, keys under it. */
:root{color-scheme:dark;--room:#0d0f0c;--body:#23271f;--edge:#353b2f;--lcd:#c7f0d8;--ink:#43523d;--dim:#8d9c84}
:root[data-theme=light]{--room:#dfe5d8;--body:#23271f;--edge:#353b2f;--dim:#4f5a48}
:root[data-theme=dark]{--room:#0d0f0c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 30%,#1b2117 0,var(--room) 70%);color:var(--lcd);font:16px/1.5 'VT323',ui-monospace,monospace;overflow-x:clip}
:root[data-theme=light] body{background:var(--room)}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 12px 32px}
.phone{background:linear-gradient(160deg,#2e3428 0,var(--body) 45%,#181b15 100%);border:1px solid var(--edge);border-radius:46px 46px 64px 64px;padding:26px 22px 24px;box-shadow:0 30px 60px -20px #000,inset 0 1px 0 #4a5240;width:min(420px,94vw)}
.brand{font:12px 'Silkscreen',monospace;color:var(--dim);text-align:center;margin:0 0 12px}
.bezel{background:#12140f;border-radius:14px;padding:12px;box-shadow:inset 0 2px 8px #000}
canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:4px;background:var(--lcd)}
.layers{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:14px}
.layers span{font:10px 'Silkscreen',monospace;text-align:center;color:#4c5444;padding:3px 0;border-radius:3px;transition:color .15s,background .15s}
.layers span.on{color:var(--ink);background:var(--lcd)}
.home{display:block;margin:14px auto 0;font:12px 'Silkscreen',monospace;color:var(--lcd);background:#2b3125;border:1px solid var(--edge);border-radius:20px;min-height:44px;padding:0 22px;cursor:pointer}
.home:focus-visible,.piano button:focus-visible,#start:focus-visible{outline:2px solid var(--lcd);outline-offset:2px}
.piano{display:flex;justify-content:center;height:96px;width:min(760px,100%);overflow-x:auto;padding-bottom:4px}
.piano button{width:28px;height:96px;flex:none;padding:0;border:1px solid #11140e;border-radius:0 0 4px 4px;background:var(--lcd);touch-action:none;user-select:none;cursor:pointer}
.piano button.b{background:#2b3125;height:58px;width:20px;margin:0 -10px;z-index:1;border-color:#11140e}
.piano button.lit{background:var(--ink)}
.piano button.b.lit{background:#8fb39b}
.hint{color:var(--dim);text-align:center;max-width:56ch;margin:0;font-size:18px}
.hint b{color:var(--lcd);font-weight:400}
#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(9,11,8,.92);border:0;color:var(--lcd);cursor:pointer;width:100%;font:inherit}
#start span{display:block;text-align:center}
#start strong{display:block;font:400 clamp(30px,7vw,46px)/1.05 'Silkscreen',monospace;margin-bottom:10px}
#start small{color:var(--dim);font-size:20px}
@media(max-width:600px){.phone{padding:20px 14px 18px;border-radius:34px 34px 48px 48px}.layers span{font-size:8px}.piano button{width:24px}.piano button.b{width:16px;margin:0 -8px}}
@media(prefers-reduced-motion:reduce){.layers span{transition:none}}
</style>
</head>
<body>
<main>
  <div class="phone">
    <p class="brand">NEURAL JOHNNY &middot; FM-1</p>
    <div class="bezel"><canvas id="lcd" width="240" height="240" role="img" aria-label="Neural Johnny screen: one oscillator line for every sound that plays"></canvas></div>
    <div class="layers" id="layers" aria-label="Layers playing"></div>
    <button class="home" id="home">HOME</button>
  </div>
  <div class="piano" id="piano" aria-label="FM-1 keys, F3 to G5"></div>
  <p class="hint">Play <b>1&ndash;16 notes</b> and stop: the model answers and keeps developing your motif, a new layer every 8 bars. Play a new melody at any time. Keys: <b>A W S E D F T G Y H U J K O L P ; '</b> from C4, <b>Z / X</b> octave, <b>Esc</b> home.</p>
</main>
<button id="start"><span><strong>NEURAL JOHNNY</strong><small>tap or press a key &middot; sound on</small></span></button>
<script>
{
const WASM_B64 = "%%WASM%%";
const NAMES = ['LEAD','KICK','BASS','HATS','DRONE','CLAP','ECHO','PERC'];
const PIANO = "awsedftgyhujkolp;'";
const HOME = 8;
const lcd = document.getElementById('lcd'), ctx = lcd.getContext('2d');
const img = ctx.createImageData(240,240);
const layersEl = document.getElementById('layers');
layersEl.innerHTML = NAMES.map(n => '<span>' + n + '</span>').join('');
const layerSpans = [...layersEl.children];
let ex = null, mem = null, keys = 0, buttons = 0, kLatch = 0, bLatch = 0, base = 60, started = false, lastSerial = -1, lastLayers = -1;
const t0 = performance.now();
const now = () => Math.floor(performance.now() - t0);
const env = {
  johnny_hal_led(i, on){ if(i < 14) return; const k = document.querySelector('[data-k="' + (i - 14) + '"]'); if(k) k.classList.toggle('lit', !!on); }
};
function draw(){
  if(!ex) return;
  const s = ex.serial();
  if(s !== lastSerial){
    lastSerial = s;
    img.data.set(new Uint8ClampedArray(mem.buffer, ex.screen(), 240 * 240 * 4));
    ctx.putImageData(img, 0, 0);
  }
  const l = ex.layers();
  if(l !== lastLayers){ lastLayers = l; layerSpans.forEach((sp, i) => sp.classList.toggle('on', !!(l & (1 << i)))); }
  requestAnimationFrame(draw);
}
async function start(){
  if(started) return; started = true;
  document.getElementById('start').remove();
  const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
  const {instance} = await WebAssembly.instantiate(bytes, {env});
  ex = instance.exports; mem = ex.memory;
  let ac;
  try { ac = new AudioContext({sampleRate: 44100}); } catch(e) { ac = new AudioContext(); }
  const sp = ac.createScriptProcessor(1024, 0, 2);
  sp.onaudioprocess = e => {
    const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
    const a = new Float32Array(mem.buffer, ex.render(1024), 2048);
    for(let i = 0; i < 1024; i++){ L[i] = a[2 * i]; R[i] = a[2 * i + 1]; }
  };
  sp.connect(ac.destination);
  try { await ac.resume(); } catch(e) {}
  ex.init(now());
  /* latch: a tap shorter than one tick still reaches the app */
  setInterval(() => { ex.tick(now(), keys | kLatch, buttons | bLatch); kLatch = bLatch = 0; }, 5);
  requestAnimationFrame(draw);
}
const keyIndex = k => { const i = PIANO.indexOf(k); if(i < 0) return -1; const idx = base - 53 + i; return idx >= 0 && idx < 27 ? idx : -1; };
const held = new Map();
function down(e){
  if(e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if(!started){ e.preventDefault(); start(); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if(k === 'Escape'){ buttons |= 1 << HOME; bLatch |= 1 << HOME; held.set(e.code, {b: HOME}); e.preventDefault(); return; }
  if(k === 'z' || k === 'x'){ base = Math.max(48, Math.min(72, base + (k === 'z' ? -12 : 12))); return; }
  const i = keyIndex(k);
  if(i >= 0){ keys |= 1 << i; kLatch |= 1 << i; held.set(e.code, {i}); e.preventDefault(); }
}
function up(e){
  const h = held.get(e.code); if(!h) return; held.delete(e.code);
  if(h.b !== undefined) buttons &= ~(1 << h.b); else keys &= ~(1 << h.i);
}
addEventListener('keydown', down); addEventListener('keyup', up);
addEventListener('blur', () => { keys = buttons = 0; held.clear(); });
document.getElementById('start').addEventListener('click', start);
const press = (el, on, off) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); if(!started){ start(); return; } el.setPointerCapture(e.pointerId); on(); });
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
};
press(document.getElementById('home'), () => { buttons |= 1 << HOME; bLatch |= 1 << HOME; }, () => buttons &= ~(1 << HOME));
const piano = document.getElementById('piano');
for(let i = 0; i < 27; i++){
  const m = (53 + i) % 12, b = document.createElement('button');
  b.dataset.k = i; b.setAttribute('aria-label', ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m] + (Math.floor((53 + i) / 12) - 1));
  if([1,3,6,8,10].includes(m)) b.className = 'b';
  piano.appendChild(b);
  press(b, () => { keys |= 1 << i; kLatch |= 1 << i; }, () => keys &= ~(1 << i));
}
}
</script>
</body>
</html>
