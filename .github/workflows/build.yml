# Neural Johnny: build the firmware and the installer site in the cloud (GitHub Actions).
# Runs on every push to main, or by hand: Actions > build > Run workflow.
# Result: the "Neural Johnny" download (firmware, installer, checksum) and, if GitHub Pages
# is set to "GitHub Actions", the live site with a ready installer.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write     # only used by the release step (tag + GitHub Release)
    steps:
      - uses: actions/checkout@v4

      - name: JieLi Windows toolchain 2.5.3
        shell: pwsh
        timeout-minutes: 40
        run: ./tools/ci/Install-JieLi.ps1

      - name: Build Neural Johnny (firmware + installer + site)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $env:FM1_SOURCE_URL = "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip"
          ./tools/Make-Site.ps1

      - name: Size report (only when the build fails)
        if: failure()
        shell: pwsh
        run: |
          $nm = Join-Path $env:FM1_PI32_TOOLCHAIN 'bin\llvm-nm.exe'
          $elf = 'build\dx7\sdk.elf'
          if (!(Test-Path $elf)) { Write-Host 'No ELF to inspect.'; exit 0 }
          $all = & $nm --print-size --size-sort --radix=d $elf
          Write-Host '--- 100 largest symbols ---'
          $all | Select-Object -Last 100 | ForEach-Object { Write-Host $_ }
          Write-Host '--- echo / screen symbols ---'
          $all | Select-String 'echo|sp_|syn_|screen|paint|draw|text|glyph|font' | Select-Object -Last 80 | ForEach-Object { Write-Host $_ }

      - uses: actions/upload-artifact@v4
        with:
          name: 'Neural-Johnny'
          path: |
            docs/downloads/
            docs/install/flasher.html
          if-no-files-found: error

      # A new JOHNNY_VERSION in app/johnny/johnny_app.h that has no release yet:
      # tag this commit v<version> and publish a GitHub Release with the firmware.
      - name: GitHub Release (new version only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = [regex]::Match((Get-Content app/johnny/johnny_app.h -Raw), '#define JOHNNY_VERSION "([0-9.]+)"')
          if (!$m.Success) { Write-Host 'No JOHNNY_VERSION found.'; exit 0 }
          $version = $m.Groups[1].Value
          $tag = 'v' + $version
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag exists already."; exit 0 }
          # Release notes: this version's section of CHANGELOG.md
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern ('^## ' + [regex]::Escape($version) + '\b') | Select-Object -First 1).LineNumber
          $notes = @()
          if ($start) {
            for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { break }; $notes += $lines[$i] }
          }
          $sha = (Get-Content docs/downloads/SHA256SUMS.txt -Raw).Trim()
          $notes += ''
          $notes += '### Install'
          $notes += 'Open the web installer: https://orion-musica.github.io/NEURAL-JOHNNY-FM-1/install/ (desktop Chrome or Edge, USB). Or flash `NeuralJohnny.fwsc` by hand.'
          $notes += ''
          $notes += ('SHA-256: `' + $sha + '`')
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Copy-Item docs/install/flasher.html NeuralJohnny-installer.html
          gh release create $tag --target $env:GITHUB_SHA docs/downloads/NeuralJohnny.fwsc docs/downloads/SHA256SUMS.txt docs/downloads/JOHNNY_README.md NeuralJohnny-installer.html --title ('Neural Johnny ' + $version) --notes-file release-notes.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
